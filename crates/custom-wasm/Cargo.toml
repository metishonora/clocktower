[package]
name = "clocktower-custom-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
custom-runtime-fixtures = ["clocktower-custom-domain/custom-runtime-fixtures"]

[dependencies]
clocktower-custom-domain = { path = "../custom-domain" }
wasm-bindgen = "=0.2.100"
