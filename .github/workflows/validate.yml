name: Validate Clocktower

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static PWA
        run: pnpm --dir web build
      - name: Verify PWA build contract
        run: pnpm --dir web verify:pwa
      - name: Test custom domain and WASM
        run: cargo test -p clocktower-custom-domain -p clocktower-custom-wasm
      - name: Test custom runtime fixtures
        run: pnpm test:custom-runtime
      - name: Test custom web contracts and UI
        run: pnpm --dir web test:custom
      - name: Install browser engines
        run: pnpm --dir web exec playwright install --with-deps chromium webkit
      - name: Smoke test production build
        run: pnpm --dir web test:smoke:run
      - name: Test scenario reference PDF and Jinx UI
        run: pnpm --dir web test:reference:run
        env:
          REFERENCE_PREVIEW: "1"
