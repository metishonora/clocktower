name: Validate Clocktower

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Test web app
        run: pnpm --dir web test
      - name: Test server lifecycle
        run: pnpm test:test-server
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Test production browser paths
        env:
          CLOCKTOWER_TEST_SERVER_PUBLIC_IPV4: 127.0.0.1
        run: pnpm test:browser
